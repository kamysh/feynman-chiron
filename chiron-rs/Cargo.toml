[package]
name = "chiron-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chiron-rs"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sqlx         = { version = "0.9",  features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "json"] }
pgvector     = { version = "0.4",  features = ["sqlx"] }
candle-core         = "0.9"
candle-nn           = "0.9"
candle-transformers = "0.9"
hf-hub     = "0.3"
tokenizers = { version = "0.19", features = ["onig"] }
uuid       = { version = "1", features = ["v4"] }
anyhow     = "1"

[dev-dependencies]
wiremock = "0.6"
