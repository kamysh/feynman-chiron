[package]
name = "chiron-agent"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "chiron-rs"
path = "src/main.rs"

[dependencies]
chiron-core = { path = "../core" }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid        = { workspace = true }
anyhow      = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
